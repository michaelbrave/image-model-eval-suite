groups:
  routed-default:
    description: Domain-routed scorer set for core model characterization. DINOv3 aesthetic V1 is the current generalist aesthetic scorer.
    always:
      - brightness-contrast
      - dinov3-aesthetic-v1
    prompt_style_fit:
      - image-reward
    prompt_adherence:
      - image-reward
    routes:
      - match:
          domain: anime_cartoon
        scorers:
          - cafe-aesthetic
          - image-reward
      - match:
          domain: illustration_painting
        scorers:
          - aesthetics-scorer
      - match:
          probes_any:
            - painting
            - watercolor
            - ink
            - storybook
        scorers:
          - aesthetics-scorer
      - match:
          subject: portrait
        scorers:
          - sd-chad
      - match:
          probes_any:
            - face
            - skin
            - hair
            - anime_face
        scorers:
          - sd-chad
      - match:
          domain: photography
        scorers:
          - sd-chad
