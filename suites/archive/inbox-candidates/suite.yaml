id: inbox-candidates
version: 1
name: Inbox Candidate Prompt Evaluation Suite
description: Candidate prompts extracted from prompt-inbox, cleaned for standalone
  text-to-image evaluation, and translated into 6 prompt styles with 4 seed variants
  each. This suite is intended for broad screening before selecting replacements for
  weak core-100 prompts.
case_policy:
  cases_file: cases.jsonl
  seed_variants: 4
  aspect_ratios:
    square:
    - 1024
    - 1024
    portrait:
    - 832
    - 1216
    landscape:
    - 1216
    - 832
    wide:
    - 1344
    - 768
    tall:
    - 768
    - 1344
scoring:
  recommended:
  - brightness-contrast
  - improved-aesthetic-predictor
  optional_prompt_aware:
  - image-reward
aggregation:
  primary_groupings:
  - domain
  - subject
  - prompt_style
  - probes
  - aspect_ratio
  - source_file
