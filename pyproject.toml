[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image-model-eval-suite"
version = "0.1.0"
description = "Portable prompt-style and image-model evaluation suites for ComfyUI models."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10",
  "PyYAML>=6",
  "requests>=2.31",
]

[project.optional-dependencies]
improved-aesthetic = [
  "numpy",
  "torch",
  "Pillow",
]

dev = ["pytest>=8"]

[project.scripts]
image-model-eval = "model_eval_suite.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
